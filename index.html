<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE BUSCA TRABALHADORES</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>



    <main class="container">
        <div class="icone">
            <img src="">
        </div>
        <h1>BUSCANDO TRABALHADORES</h1>
        <p>preencha o fómulario para te dar uma recomendação</p>
        <!-- CAMPO NOME -->
        <form id="formulario">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>
            <!-- CAMPO EMAIL -->
            <label for="email">Digite seu E-MAIL</label>
            <input type="email" id="email" placeholder="Digite o email" required>
            <!-- CAMPO DE TELEFONE -->
            <label id="telefone">telefone:</label>
            <input type="telefone" id="telefone" placeholder="(11)03993-6484" required>
            <!-- CAMPO DE CARGOS -->
             <select id="cargos">
                <option value="selecione uma opção">Selecione uma opção</option>
                <option value="Auxiliar de limpeza">Auxiliar de limpeza</option>
                <option value="Pedreiro">Pedreiro</option>
                <option value="Carpinteiro">Carpinteiro</option>
                <option value="">Otros</option>
             </select>
             <!-- CAMPO DE TRABALHOS -->
             <label for="mensagem">OBSERVAÇÕES</label>
             <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>
             <button type="submit">Enviar solicitação</button>
        </form>
        
    </main>

    <script src="./main.js"></script>


</body>

</html>
